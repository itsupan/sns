# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
      - development
  path_filters:
    - '!pnpm-lock.yaml'
    - '!migrations/meta/**'
    - '!src/lib/server/db/auth-schema.ts'
    - '!worker-configuration.d.ts'
  path_instructions:
    - path: 'src/**/*.svelte'
      instructions: 'Svelte 5 with runes only ($state, $derived, $props). Flag legacy `export let` or `$:` syntax.'
    - path: 'src/lib/server/**'
      instructions: 'Server-only code on Cloudflare Workers: no Node-only APIs beyond nodejs_compat, read bindings and secrets from platform.env, never leak secrets to the client.'
    - path: 'migrations/*.sql'
      instructions: 'Generated by drizzle-kit and applied to production D1. Check for destructive changes (DROP, column removal) and data loss.'
chat:
  auto_reply: true
