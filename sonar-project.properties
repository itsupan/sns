# SonarCloud analysis, run by the `ci` job in .github/workflows/cicd.yml.
# Import the repo at https://sonarcloud.io, turn off "Automatic Analysis"
# (CI-based analysis needs it off), and check the two keys below match.
sonar.organization=itsupan
sonar.projectKey=itsupan_sns
sonar.projectName=sns

sonar.sources=src
sonar.tests=src
sonar.exclusions=src/**/*.spec.ts,src/**/*.test.ts,src/**/*.e2e.ts,src/lib/server/db/auth-schema.ts
sonar.test.inclusions=src/**/*.spec.ts,src/**/*.test.ts,src/**/*.e2e.ts

# Produced by `pnpm test:coverage`.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
